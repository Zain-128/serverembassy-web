name: Deploy Web to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Deployment on VPS..."
            cd /var/www/serverembassy-web

            echo "📥 Pulling latest changes from git..."
            git pull origin main || git pull origin master

            echo "📦 Installing dependencies..."
            npm ci --prefer-offline --no-audit

            echo "🔨 Building Next.js application..."
            npm run build

            echo "📂 Ensuring static assets and public directory are copied..."
            cp -r public .next/standalone/ || true
            cp -r .next/static .next/standalone/.next/ || true

            echo "♻️ Reloading PM2 with zero downtime..."
            pm2 reload serverembassy-web --update-env || pm2 start ecosystem.config.js

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "✅ Deployment completed successfully!"
